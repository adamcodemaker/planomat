name: Update plan 4B

on:
  schedule:
    - cron: "0 5,14 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/update-plan.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - name: Fetch school plan and generate ICS
        run: npm run fetch

      - name: Commit ICS if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/plan-4b.ics
          if git diff --staged --quiet; then
            echo "Plan bez zmian"
          else
            git commit -m "Aktualizacja planu 4B"
            git push
          fi
