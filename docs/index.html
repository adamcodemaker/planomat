  <body>
    <h1>Plan lekcji SP143</h1>
    <p>
      Kalendarze ICS do subskrypcji w Google Calendar. Adres:
      <code>/{klasa}/{grupa}.ics</code>
      — klasa małymi literami, grupa <code>1</code> albo <code>2</code>.
    </p>
    <p>Przykłady dla 4B:</p>
    <ul>
      <li><a href="./4b/1.ics">4b/1.ics</a> — grupa 1</li>
      <li><a href="./4b/2.ics">4b/2.ics</a> — grupa 2</li>
    </ul>
    <p>
      W Google Calendar: Inne kalendarze → plus → Z URL → wklej pełny adres
      wybranego pliku <code>.ics</code>.
    </p>
  </body>
